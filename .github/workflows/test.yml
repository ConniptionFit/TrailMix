name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          # The action's default list includes the legacy 'tools' package, which the SDK
          # repository no longer serves ("Failed to find package 'tools'").
          packages: 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4

      # BLD-03's full gate: unit tests (both variants), Android Lint against the committed
      # baseline, and ktlint. Matches what a contributor runs locally before handoff.
      - name: Run checks (unit tests, lint, ktlint)
        run: ./gradlew check --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: Android/app/build/reports/lint-results-debug.html

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: Android/app/build/reports/tests/testDebugUnitTest/
